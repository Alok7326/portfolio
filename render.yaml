services:
  - type: web
    name: portfolio-frontend
    runtime: node
    repo: https://github.com/your-username/your-repo
    buildCommand: cd Frontend && npm install && npm run build
    startCommand: cd Frontend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 3000
